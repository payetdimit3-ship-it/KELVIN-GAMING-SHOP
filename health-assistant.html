<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Health Assistant - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Health Assistant
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'health-assistant.html',
      pg: 'health',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var hk = pg;
      return '<h1>'
        + (hk === 'ai' ? 'AI Assistant' : 'Health Assistant')
        + '</h1><p class="sub">'
        + (
          hk === 'ai'
            ? 'Uliza kuhusu games, bei na malipo'
            : 'Taarifa za jumla za afya — si badala ya '
              + 'daktari. Dharura: tafuta huduma ya '
              + 'haraka.'
        )
        + '</p><div class="panel"><div id="bx" '
        + 'style="max-height:55vh;overflow:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px">'
        + botHtml(hk)
        + '</div><form class="row" '
        + 'onsubmit="botSend(event,\''
        + hk
        + '\')"><input name="m" style="flex:1" '
        + 'placeholder="Andika swali lako..." '
        + 'autocomplete="off" required>'
        + '<button class="btn" type="submit">Tuma'
        + '</button></form></div>';
    });
  </script>

</body>
</html>
