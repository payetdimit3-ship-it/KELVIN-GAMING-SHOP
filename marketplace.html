<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Biashara &amp; Washirika - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Biashara &amp; Washirika
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'marketplace.html',
      pg: 'market',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var K2 = db.market.filter(function (m) {
        return !q
          || String(m.businessName).toLowerCase().indexOf(q) >
            -1;
      }),
        pk = [
          [
            '📋 Orodha ya Biashara',
            'Biashara yako inaonekana kwenye '
              + 'directory yetu ya wachezaji na wapenzi '
              + 'wa gaming.'
          ],
          [
            '⭐ Featured / Banner',
            'Nafasi ya kipekee na matangazo ya '
              + 'banner kwa kampeni yako.'
          ],
          [
            '🤝 Ushirikiano Maalum',
            'Kampeni, matukio na tournaments pamoja '
              + '— tunapanga kulingana na malengo yako.'
          ]
        ];
      return '<div class="hero" '
        + 'style="padding:44px 28px"><h1>'
        + 'TANGAZA BIASHARA YAKO NASI</h1>'
        + '<p class="sub" style="max-width:640px">'
        + 'Fikia wachezaji na wapenzi wa gaming '
        + 'nchini Tanzania. Directory ya biashara, '
        + 'matangazo na kampeni za ushirikiano.</p>'
        + '<a class="btn" href="marketplace.html" '
        + 'onclick="document.getElementById(\'bizform\').scrollIntoView();return false">'
        + 'Omba kutangaza</a></div><h2>'
        + 'Njia za kushirikiana</h2><div '
        + 'class="grid" '
        + 'style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">'
        + pk.map(function (x) {
          return '<div class="card"><div class="b"><b>'
            + x[0]
            + '</b><span class="sub" style="margin:0">'
            + x[1]
            + '</span></div></div>';
        }).join('')
        + '</div>'
        + (
          isAdm()
            ? '<div class="panel">'
              + '<h2 style="margin-top:0">Add Listing'
              + '</h2><form onsubmit="addM(event)">'
              + '<label>Jina la biashara'
              + '<input name="b" required></label><label>'
              + 'Category<input name="c" '
              + 'placeholder="mf. Accounts"></label>'
              + '<label>Mawasiliano<input name="k" '
              + 'required placeholder="+255..."></label>'
              + '<label>Image URL'
              + '<input name="i" type="url"></label>'
              + '<label class="full">Maelezo'
              + '<textarea name="d" rows="2"></textarea>'
              + '</label><div class="full">'
              + '<button class="btn" type="submit">'
              + 'Save Listing</button></div></form></div>'
            : ''
        )
        + '<h2>Biashara zilizopo ('
        + K2.length
        + ')</h2>'
        + (
          K2.length
            ? '<div class="grid">'
              + K2.map(function (m) {
                return '<div class="card">'
                  + (
                    m.imageUrl
                      ? '<img src="'
                        + esc(m.imageUrl)
                        + '" alt="">'
                      : '<div class="ph"></div>'
                  )
                  + '<div class="b"><b>'
                  + esc(m.businessName)
                  + '</b><span class="tag">'
                  + esc(m.category)
                  + '</span>'
                  + '<span class="sub" style="margin:0">'
                  + esc(m.description)
                  + '</span><div class="price">'
                  + esc(m.contact)
                  + '</div>'
                  + (
                    isAdm()
                      ? '<button class="btn d" onclick="delM(\''
                        + m.id
                        + '\')">Futa</button>'
                      : ''
                  )
                  + '</div></div>';
              }).join('')
              + '</div>'
            : '<div class="empty">Hakuna biashara bado.</div>'
        )
        + '<div class="panel" id="bizform">'
        + '<h2 style="margin-top:0">'
        + 'Omba kutangaza / kushirikiana</h2>'
        + '<p class="sub">'
        + 'Jaza fomu na tutawasiliana nawe.</p>'
        + '<form onsubmit="sendInq(event)"><label>'
        + 'Jina la biashara/kampuni'
        + '<input name="n" required></label><label>'
        + 'Mtu wa mawasiliano<input name="c">'
        + '</label><label>Simu'
        + '<input name="p" placeholder="+255...">'
        + '</label><label>Email'
        + '<input name="e" type="email"></label>'
        + '<label>Website/Instagram<input name="w">'
        + '</label><label>Bajeti (hiari)'
        + '<input name="b"></label>'
        + '<label class="full">Unataka kutangaza '
        + 'nini / aina ya ushirikiano'
        + '<textarea name="m" rows="3"></textarea>'
        + '</label><div class="full">'
        + '<button class="btn" type="submit">'
        + 'Tuma Ombi</button></div></form></div>';
    });
  </script>

</body>
</html>
