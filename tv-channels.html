<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tv Channels.Html</title><meta http-equiv="refresh" content="0;url=live TV Channels.html">
<script>location.replace('live TV Channels.html' + location.search + location.hash);</script>
<style>body{font-family:system-ui;background:#0b1020;color:#e8ecff;display:grid;place-items:center;min-height:100vh}a{color:#7dd3fc}</style></head>
<body><p>Opening <a href="live TV Channels.html">Tv Channels.Html</a>…</p>
<script id="lifeisgametz-navigation-repair">
(function () {
  function initNavigationRepair() {
    var toggles = document.querySelectorAll('[data-mobile-menu-toggle="true"]');
    var nav = document.querySelector('aside') || document.querySelector('[role="navigation"]') ||
              document.querySelector('nav');
    toggles.forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!nav) {
          window.location.href = 'index.html';
          return;
        }
        nav.classList.toggle('lifeisgametz-mobile-nav-open');
        nav.style.display = nav.classList.contains('lifeisgametz-mobile-nav-open') ? 'flex' : '';
        nav.style.position = nav.classList.contains('lifeisgametz-mobile-nav-open') ? 'fixed' : '';
        nav.style.zIndex = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '9999' : '';
        nav.style.top = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0' : '';
        nav.style.left = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0' : '';
        nav.style.bottom = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0' : '';
        nav.style.width = nav.classList.contains('lifeisgametz-mobile-nav-open') ? 'min(85vw, 320px)' : '';
        nav.style.overflowY = nav.classList.contains('lifeisgametZ-mobile-nav-open') ? 'auto' : '';
        nav.style.background = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '#0f0f1e' : '';
        nav.style.paddingTop = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '1rem' : '';
        nav.style.boxShadow = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0 0 0 100vmax rgba(0,0,0,.65)' : '';
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && nav) {
        nav.classList.remove('lifeisgametz-mobile-nav-open');
        nav.style.display = '';
        nav.style.position = nav.style.zIndex = nav.style.top = nav.style.left = nav.style.bottom = '';
        nav.style.width = nav.style.overflowY = nav.style.background = nav.style.paddingTop = nav.style.boxShadow = '';
      }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNavigationRepair);
  else initNavigationRepair();
})();
</script>

</body></html>
