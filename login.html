<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Login - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Login
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'login.html',
      pg: 'login',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      if (me())
        return '<div class="empty">Umeingia tayari.<br>'
          + '<br><a class="btn" href="profile.html">'
          + 'Fungua Profile</a></div>';
      var rg = pg === 'register';
      return '<div class="auth"><div class="promo">'
        + '<h1>'
        + (rg ? 'Fungua Akaunti' : 'Welcome Back!')
        + '</h1><p>Nunua games, hifadhi wishlist '
        + 'na uone Library yako.</p><ul><li>Lipa '
        + 'kwa M-Pesa, Tigo Pesa au Airtel Money'
        + '</li><li>Pata games za bure</li><li>'
        + 'Fuatilia oda zako</li></ul></div>'
        + '<div class="panel" style="margin:0">'
        + '<div class="row" '
        + 'style="margin-bottom:14px">'
        + '<a class="btn '
        + (rg ? 'o' : '')
        + '" style="flex:1;text-align:center" '
        + 'href="login.html">Login</a>'
        + '<a class="btn '
        + (rg ? '' : 'o')
        + '" style="flex:1;text-align:center" '
        + 'href="register.html">Register</a></div>'
        + (
          rg
            ? '<form onsubmit="reg(event)">'
              + '<label class="full">Jina kamili'
              + '<input name="nm" required></label>'
              + '<label class="full">Email'
              + '<input name="em" type="email" required>'
              + '</label><label class="full">Simu'
              + '<input name="ph" placeholder="+255...">'
              + '</label><label class="full">Password'
              + '<input name="pw" type="password" '
              + 'required minlength="6"></label>'
              + '<div class="full"><button class="btn" '
              + 'style="width:100%" type="submit">'
              + 'Create Account</button></div></form>'
            : '<form onsubmit="login(event)">'
              + '<label class="full">Email'
              + '<input name="em" type="email" required>'
              + '</label><label class="full">Password'
              + '<input name="pw" type="password" '
              + 'required></label><div class="full">'
              + '<button class="btn" style="width:100%" '
              + 'type="submit">Login</button></div>'
              + '</form>'
        )
        + '</div></div>';
    });
  </script>

</body>
</html>
