<!doctype html>
<html lang="sw">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in — MchezoHub</title><link rel="stylesheet" href="mchezo.css"></head>
<body>
  <main class="mh-auth"><section class="mh-auth-card">
    <a class="mh-brand" href="index.html"><b class="mh-mark">MH</b><span>Mchezo<span>Hub</span></span></a>
    <div class="mh-kicker" style="margin-top:28px">PLAYER ACCESS</div><h1>Sign in</h1><p class="mh-muted">Ingia kwa Google au email ili kufungua account yako.</p>
    <form class="mh-form" data-login>
      <label>Email<input required type="email" autocomplete="email" placeholder="you@example.com"></label>
      <label>Password<input required type="password" autocomplete="current-password" placeholder="••••••••"></label>
      <div class="mh-alert" role="status"></div><button class="mh-btn" type="submit">Sign in</button>
      <button class="mh-btn secondary" type="button" onclick="alert('Google OAuth itaunganishwa ukiweka Supabase credentials kwenye server.')">Continue with Google</button>
    </form>
    <p class="mh-form-note">Huna account? <a class="mh-cyan" href="signup.html">Fungua account mpya</a><br><a href="../index.html">← Rudi Kelvin Gaming Shop</a></p>
  </section></main>
  <script src="mchezo.js"></script>
</body>
</html>
