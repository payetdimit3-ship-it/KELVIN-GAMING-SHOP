<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingia / Jisajili — LifeIsGameTZ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0C11; --bg-alt: #0F1219; --panel: #151922; --panel-2: #1B202B; --border: #262C3A;
    --text: #EEF2F7; --muted: #8890A3;
    --cyan: #1BE7E3; --cyan-soft: rgba(27,231,227,0.12); --cyan-glow: rgba(27,231,227,0.55);
    --magenta: #FF3E9C; --magenta-soft: rgba(255,62,156,0.12);
    --red: #E5545E; --red-soft: rgba(229,84,94,0.14);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:'Rajdhani', sans-serif; font-size:16px;
    min-height:100vh; display:flex; align-items:center; justify-content:center; overflow-x:hidden; padding:1.4rem;
  }
  h1,.logo{ font-family:'Orbitron', sans-serif; }
  a{ text-decoration:none; color:inherit; }

  .grid-bg{ position:fixed; inset:0; z-index:-2;
    background-image:linear-gradient(rgba(27,231,227,0.05) 1px, transparent 1px),linear-gradient(90deg, rgba(27,231,227,0.05) 1px, transparent 1px);
    background-size:42px 42px; -webkit-mask-image:radial-gradient(circle at center, rgba(0,0,0,.9), transparent 70%); mask-image:radial-gradient(circle at center, rgba(0,0,0,.9), transparent 70%); }
  .glow-blob{ position:fixed; border-radius:50%; filter:blur(120px); z-index:-1; opacity:.3; }
  .glow-1{ width:480px; height:480px; background:var(--cyan); top:-160px; left:-160px; }
  .glow-2{ width:420px; height:420px; background:var(--magenta); bottom:-160px; right:-160px; }

  .auth-box{ width:100%; max-width:420px; }
  .logo{ font-size:1.4rem; font-weight:800; display:flex; align-items:center; gap:.6rem; justify-content:center; margin-bottom:1.6rem; }
  .logo .mark{ width:38px; height:38px; border-radius:9px; background:linear-gradient(135deg, var(--cyan), var(--magenta));
    display:flex; align-items:center; justify-content:center; font-size:1.2rem; }

  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:1.8rem; }
  .tabs{ display:flex; gap:.4rem; margin-bottom:1.4rem; background:var(--panel-2); border-radius:10px; padding:.3rem; }
  .tab{ flex:1; text-align:center; padding:.6rem; border-radius:8px; font-size:.9rem; font-weight:600; color:var(--muted); cursor:pointer; }
  .tab.active{ background:var(--cyan); color:#05181A; }

  .view{ display:none; }
  .view.active{ display:block; }

  .form-row{ margin-bottom:1rem; }
  .form-row label{ display:block; font-size:.8rem; color:var(--muted); margin-bottom:.4rem; }
  .form-row input, .form-row select{
    width:100%; background:var(--bg-alt); border:1px solid var(--border); border-radius:8px;
    padding:.7rem .9rem; color:var(--text); font-family:inherit; font-size:.92rem; outline:none;
  }
  .form-row input:focus, .form-row select:focus{ border-color:var(--cyan); }

  .btn{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size:.95rem; padding:.8rem; border-radius:8px; cursor:pointer; border:1px solid transparent; width:100%; }
  .btn-cyan{ background:var(--cyan); color:#05181A; box-shadow:0 0 20px var(--cyan-glow); }
  .btn-cyan:disabled{ opacity:.6; cursor:not-allowed; }

  .msg-box{ display:none; padding:.7rem .9rem; border-radius:8px; font-size:.82rem; margin-bottom:1rem; }
  .msg-box.show{ display:block; }
  .msg-box.error{ background:var(--red-soft); color:var(--red); border:1px solid var(--red); }
  .msg-box.success{ background:var(--cyan-soft); color:var(--cyan); border:1px solid var(--cyan); }

  .switch-link{ text-align:center; font-size:.85rem; color:var(--muted); margin-top:1.2rem; }
  .switch-link a{ color:var(--cyan); font-weight:600; cursor:pointer; }
  .back-home{ text-align:center; margin-top:1.4rem; font-size:.82rem; color:var(--muted); }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="glow-blob glow-1"></div>
<div class="glow-blob glow-2"></div>

<div class="auth-box">
  <a href="home.html" class="logo"><div class="mark">🎮</div>LifeIsGameTZ</a>

  <div class="panel">
    <div class="tabs">
      <div class="tab active" data-tab="login" onclick="switchAuthTab('login')">Ingia</div>
      <div class="tab" data-tab="signup" onclick="switchAuthTab('signup')">Jisajili</div>
    </div>

    <div class="msg-box" id="authMsg"></div>

    <!-- LOGIN -->
    <div class="view active" id="view-login">
      <div class="form-row"><label>Barua Pepe</label><input type="email" id="loginEmail" placeholder="wewe@mfano.com"></div>
      <div class="form-row"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
      <button class="btn btn-cyan" id="loginBtn">Ingia</button>
      <div class="switch-link">Huna akaunti? <a onclick="switchAuthTab('signup')">Jisajili hapa</a></div>
    </div>

    <!-- SIGNUP -->
    <div class="view" id="view-signup">
      <div class="form-row"><label>Jina Kamili</label><input type="text" id="signupName" placeholder="Kelvin Fred Pela"></div>
      <div class="form-row"><label>Namba ya Simu</label><input type="text" id="signupPhone" placeholder="+255 7XX XXX XXX"></div>
      <div class="form-row"><label>Barua Pepe</label><input type="email" id="signupEmail" placeholder="wewe@mfano.com"></div>
      <div class="form-row"><label>Password</label><input type="password" id="signupPassword" placeholder="Angalau herufi 6"></div>
      <button class="btn btn-cyan" id="signupBtn">Jisajili</button>
      <div class="switch-link">Una akaunti tayari? <a onclick="switchAuthTab('login')">Ingia hapa</a></div>
    </div>
  </div>

  <div class="back-home"><a href="home.html">← Rudi Home</a></div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  const SUPABASE_URL = 'https://zcviroqygjtautfsyahs.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjdmlyb3F5Z2p0YXV0ZnN5YWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0Njc2ODcsImV4cCI6MjEwMjA0MzY4N30.IlEsUpRuT4sGqI9LQ1RVguJ6wlgp8YAXVNV0LCfjBnk';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  window.switchAuthTab = function(name){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab === name));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.getElementById('view-' + name).classList.add('active');
    hideMsg();
  };

  const msgBox = document.getElementById('authMsg');
  function showMsg(text, type){
    msgBox.textContent = text;
    msgBox.className = 'msg-box show ' + type;
  }
  function hideMsg(){ msgBox.className = 'msg-box'; }

  // ---------- Ikiwa tayari amelogin, mpeleke moja kwa moja (na ueleze kwa nini) ----------
  (async ()=>{
    const { data: { session } } = await supabase.auth.getSession();
    if(session){
      showMsg('Tayari umeshaingia. Tunakuelekeza...', 'success');
      await routeUserAfterAuth(session.user.id);
    }
  })();

  async function routeUserAfterAuth(userId){
    const { data: profile } = await supabase.from('profiles').select('role').eq('id', userId).maybeSingle();
    if(profile && (profile.role === 'owner' || profile.role === 'admin' || profile.role === 'staff')){
      window.location.href = 'admin-dashboard.html';
    } else {
      window.location.href = 'home.html';
    }
  }

  // ---------- LOGIN ----------
  document.getElementById('loginBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('loginBtn');
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if(!email || !password){ showMsg('Tafadhali jaza barua pepe na password.', 'error'); return; }

    btn.disabled = true; btn.textContent = 'Inaingia...';
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Ingia';

    if(error){ showMsg('Imeshindwa: ' + error.message, 'error'); return; }
    showMsg('Umefanikiwa kuingia! Unaelekezwa...', 'success');
    setTimeout(()=> routeUserAfterAuth(data.user.id), 800);
  });

  // ---------- SIGNUP ----------
  document.getElementById('signupBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('signupBtn');
    const fullName = document.getElementById('signupName').value.trim();
    const phone = document.getElementById('signupPhone').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;

    if(!fullName || !email || !password){ showMsg('Tafadhali jaza sehemu zote muhimu.', 'error'); return; }
    if(password.length < 6){ showMsg('Password lazima iwe angalau herufi 6.', 'error'); return; }

    btn.disabled = true; btn.textContent = 'Inasajili...';
    const { data, error } = await supabase.auth.signUp({ email, password });

    if(error){
      btn.disabled = false; btn.textContent = 'Jisajili';
      showMsg('Imeshindwa: ' + error.message, 'error');
      return;
    }

    // Tengeneza profile row (kama trigger ya DB haipo)
    if(data.user){
      await supabase.from('profiles').upsert({
        id: data.user.id,
        full_name: fullName,
        phone: phone || null,
        role: 'customer'
      });
    }

    btn.disabled = false; btn.textContent = 'Jisajili';

    if(data.session){
      showMsg('Usajili umefanikiwa! Unaelekezwa...', 'success');
      setTimeout(()=> routeUserAfterAuth(data.user.id), 800);
    } else {
      showMsg('Usajili umefanikiwa! Tafadhali kagua barua pepe yako kuthibitisha akaunti kabla ya kuingia.', 'success');
    }
  });
</script>
</body>
</html>
