<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Shop — GameHub</title><link rel="stylesheet" href="style.css"></head><body>
<header class="navbar"><div class="logo">🎮 <span>GAME</span>HUB</div><nav class="nav-links"><a href="index.html">Home</a><a href="shop.html">🛒 Shop</a><a href="cart.html">🛍️ Kikapu (<span id="cartCount">0</span>)</a><a href="login.html" class="btn-login">Ingia</a></nav></header>
<div class="shop-page"><div class="shop-header"><h1>🛒 Duka la Games</h1><p class="section-sub">Tafuta na nunua Steam Accounts na Game Keys</p></div>
<div class="shop-controls"><input type="text" id="searchInput" placeholder="🔍 Tafuta game..." oninput="filterProducts()"><select id="typeFilter" onchange="filterProducts()"><option value="">Aina zote</option><option value="game">🎮 Games</option><option value="account">👤 Steam Accounts</option><option value="topup">💎 Top-Ups</option></select></div>
<div class="games-grid" id="shopGrid"><p style="color:#8f8faa;grid-column:1/-1;text-align:center;">Inapakia...</p></div></div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="supabase.js"></script>
<script>
function updateCartCount(){const c=JSON.parse(localStorage.getItem('gamehubCart')||'[]');const e=document.getElementById('cartCount');if(e)e.textContent=c.reduce((s,i)=>s+i.qty,0);}updateCartCount();
async function filterProducts(){const search=document.getElementById('searchInput').value.trim();const type=document.getElementById('typeFilter').value;const grid=document.getElementById('shopGrid');try{const p=await getProducts(type,search);if(!p.length){grid.innerHTML='<p style="color:#8f8faa;grid-column:1/-1;text-align:center;">Hakuna bidhaa inayolingana.</p>';return;}grid.innerHTML=p.map(pp=>`<div class="game-card"><span class="emoji">${pp.emoji||'🎮'}</span><h3>${pp.name}</h3><div class="price">${Number(pp.price).toLocaleString()} TZS</div><span class="badge">${pp.type||'game'}</span><button class="btn-primary" style="margin-top:8px;padding:6px 12px;font-size:12px;width:100%;" onclick="addToCart(${pp.id},'${pp.name.replace(/'/g,"\\'")}',${pp.price},'${(pp.emoji||'🎮').replace(/'/g,"\\'")}')">➕ Weka Kikapu</button></div>`).join('');}catch(e){grid.innerHTML='<p style="color:#ff3d71;grid-column:1/-1;text-align:center;">Hitilafu.</p>';}}
function addToCart(id,name,price,emoji){let cart=JSON.parse(localStorage.getItem('gamehubCart')||'[]');const existing=cart.find(i=>i.id===id);if(existing){existing.qty+=1;}else{cart.push({id,name,price,emoji,qty:1});}localStorage.setItem('gamehubCart',JSON.stringify(cart));updateCartCount();alert(`✅ "${name}" imewekwa kwenye kikapu!`);}
filterProducts();
</script>
</body></html>
