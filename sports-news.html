<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Habari za Michezo - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Habari za Michezo
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'sports-news.html',
      pg: 'news',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var N = db.news.filter(function (n) {
        return !q
          || String(n.title).toLowerCase().indexOf(q) > -1;
      });
      return '<h1>Habari za Michezo</h1>'
        + '<p class="sub">'
        + 'Habari na uchambuzi wa michezo na gaming'
        + '</p>'
        + (
          isAdm()
            ? '<div class="panel">'
              + '<h2 style="margin-top:0">Chapisha habari'
              + '</h2><form onsubmit="addNews(event)">'
              + '<label class="full">Kichwa'
              + '<input name="t" required></label>'
              + '<label class="full">Muhtasari'
              + '<textarea name="s" rows="2" required>'
              + '</textarea></label><label class="full">'
              + 'Habari kamili (hiari)'
              + '<textarea name="b" rows="4"></textarea>'
              + '</label><label>Image URL'
              + '<input name="i" type="url"></label>'
              + '<label>Link ya chanzo'
              + '<input name="u" type="url"></label>'
              + '<div class="full">'
              + '<button class="btn" type="submit">'
              + 'Chapisha</button></div></form></div>'
            : ''
        )
        + (
          N.length
            ? N.map(function (n, i) {
              return '<div class="panel">'
                + (
                  n.imageUrl
                    ? '<img src="'
                      + esc(n.imageUrl)
                      + '" alt="" '
                      + 'style="width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:10px">'
                    : ''
                )
                + '<h2 style="margin:0 0 4px">'
                + esc(n.title)
                + '</h2>'
                + '<div class="sub" style="margin:0 0 8px">'
                + new Date(n.createdAt).toLocaleDateString()
                + '</div><p>'
                + esc(n.summary)
                + '</p>'
                + (
                  n.body
                    ? '<details><summary>Soma zaidi</summary>'
                      + '<p>'
                      + esc(n.body).replace(/\n/g, '<br>')
                      + '</p></details>'
                    : ''
                )
                + '<div class="row" '
                + 'style="flex-wrap:wrap;margin-top:8px">'
                + (
                  n.sourceUrl
                    ? '<a class="btn o" target="_blank" '
                      + 'rel="noopener noreferrer" href="'
                      + esc(n.sourceUrl)
                      + '">Chanzo ↗</a>'
                    : ''
                )
                + (
                  isAdm()
                    ? '<button class="btn d" onclick="delNews('
                      + db.news.indexOf(n)
                      + ')">Futa</button>'
                    : ''
                )
                + '</div></div>';
            }).join('')
            : '<div class="empty" '
              + 'style="margin-top:14px">'
              + 'Hakuna habari bado.</div>'
        );
    });
  </script>

</body>
</html>
