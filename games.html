<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Games - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Games
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'games.html',
      pg: 'games',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var cat = a[2] ? decodeURIComponent(a[2]) : '',
        L = A.filter(function (p) {
          return (!q || p.title.toLowerCase().indexOf(q) > -1)
            && (!cat || p.cat === cat);
        });
      return '<h1>Store</h1><p class="sub">'
        + 'Games zote zinazopatikana</p><div '
        + 'class="row" '
        + 'style="flex-wrap:wrap;margin-bottom:14px">'
        + '<a class="btn '
        + (cat ? 'o' : '')
        + '" href="store.html">All</a>'
        + CATS.map(function (c) {
          return '<a class="btn '
            + (cat === c ? '' : 'o')
            + '" href="store.html?p='
            + encodeURIComponent(c)
            + '">'
            + c
            + '</a>';
        }).join('')
        + '</div>'
        + (
          L.length
            ? '<div class="grid">'
              + L.map(card).join('')
              + '</div>'
            : emptyAdmin('Hakuna game inayolingana.')
        )
        + advisorHtml(
          'p:' + (cat || 'Store'),
          cat || 'Store',
          ''
        );
    });
  </script>

</body>
</html>
