<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Admin · Dashboard - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Admin · Dashboard
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'dashboard.html',
      pg: 'admin',
      p: '',
      admin: 1
    }, function (a, q, A, pg) {
      var rev = db.orders
        .filter(function (o) {
          return o.status === 'Completed';
        })
        .reduce(function (s, o) { return s + o.total; }, 0);
      return '<h1>Admin Dashboard</h1><p class="sub">'
        + 'Simamia games, bidhaa na oda zako '
        + 'mahali pamoja.</p><div class="stats">'
        + '<div class="stat"><b>'
        + db.products.length
        + '</b><span>Total Games</span></div>'
        + '<div class="stat"><b>'
        + A.length
        + '</b><span>Active</span></div>'
        + '<div class="stat"><b>'
        + db.products.filter(function (p) {
          return p.free;
        }).length
        + '</b><span>Free Games</span></div>'
        + '<div class="stat"><b>'
        + db.orders.length
        + '</b><span>Total Orders</span></div>'
        + '<div class="stat"><b>'
        + tsh(rev)
        + '</b><span>Total Revenue</span></div>'
        + '</div><div class="panel">'
        + '<div class="row sp">'
        + '<h2 style="margin:0">Quick Actions</h2>'
        + '<a class="btn" '
        + 'href="games-management.html">+ Add Game'
        + '</a></div></div><div class="panel">'
        + '<h2 style="margin-top:0">Recent Orders'
        + '</h2>'
        + (
          db.orders.length
            ? '<div class="tw"><table><tr><th>Order'
              + '</th><th>Bidhaa</th><th>Amount</th><th>'
              + 'Date</th><th>Status</th><th></th></tr>'
              + db.orders.slice(0, 8).map(function (o) {
                return '<tr><td>'
                  + esc(o.ref)
                  + '</td><td>'
                  + esc(o.items.join(', '))
                  + '</td><td>'
                  + tsh(o.total)
                  + '</td><td>'
                  + o.date
                  + '</td><td>'
                  + esc(o.status || '')
                  + '</td><td>'
                  + (
                    isAdm() && o.status === 'Pending'
                      ? '<button class="btn" onclick="conf(\''
                        + o.id
                        + '\')">Confirm</button> '
                        + '<button class="btn d" onclick="rej(\''
                        + o.id
                        + '\')">Reject</button>'
                      : ''
                  )
                  + '</td></tr>';
              }).join('')
              + '</table></div>'
            : '<div class="empty">Bado hakuna oda.</div>'
        )
        + '</div>';
    });
  </script>

</body>
</html>
