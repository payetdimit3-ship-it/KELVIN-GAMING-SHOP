<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Admin · Settings - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Admin · Settings
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'settings.html',
      pg: 'admin',
      p: 'settings',
      admin: 1
    }, function (a, q, A, pg) {
      var S = db.settings || {};
      return '<h1>Settings</h1><p class="sub">'
        + 'Maelezo ya duka yanayoonekana kwa wateja'
        + '</p><div class="panel">'
        + '<form onsubmit="saveSettings(event)">'
        + '<label>Jina la duka'
        + '<input name="sn" value="'
        + esc(S.siteName)
        + '"></label><label>'
        + 'WhatsApp (mf. 255712345678)'
        + '<input name="wa" value="'
        + esc(S.whatsapp)
        + '"></label><label>Simu ya support'
        + '<input name="sp" value="'
        + esc(S.supportPhone)
        + '"></label><label>Email ya support'
        + '<input name="se" type="email" value="'
        + esc(S.supportEmail)
        + '"></label><label class="full">Tangazo '
        + '(linaonekana juu ya kurasa zote; acha '
        + 'tupu kuondoa)'
        + '<textarea name="an" rows="2">'
        + esc(S.announcement)
        + '</textarea></label><label class="full">'
        + 'Maelezo ya malipo ya Manual (namba ya '
        + 'kutuma pesa, jina la akaunti, n.k.)'
        + '<textarea name="mp" rows="3">'
        + esc(S.manualPayInstructions)
        + '</textarea></label><label>'
        + 'Kamisheni ya Squad (%)<input name="sc" '
        + 'type="number" min="0" max="50" value="'
        + esc(S.squadCommission)
        + '"></label><label>'
        + 'Siku za ulinzi wa malipo ya muuzaji'
        + '<input name="hd" type="number" min="0" '
        + 'max="30" value="'
        + esc(S.payoutHoldDays)
        + '"></label><label>'
        + 'Kiwango cha chini cha kutoa (TSh)<input '
        + 'name="mw" type="number" min="1000" '
        + 'value="'
        + esc(S.minWithdraw)
        + '"></label><div class="full">'
        + '<button class="btn" type="submit">'
        + 'Hifadhi</button></div></form></div>';
    });
  </script>

</body>
</html>
