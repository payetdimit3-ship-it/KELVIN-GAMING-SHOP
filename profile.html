<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>My Profile - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: My Profile
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'profile.html',
      pg: 'profile',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var m = me();
      if (!m)
        return '<div class="empty">'
          + 'Ingia kwanza kuona profile yako.<br><br>'
          + '<a class="btn" href="login.html">'
          + 'Login / Register</a></div>';
      var mo = db.orders.filter(function (o) {
        return o.u === m.email;
      });
      return '<div class="pf"><div class="av big">'
        + esc(m.name.charAt(0).toUpperCase())
        + '</div><div><h1 style="margin:0">'
        + esc(m.name)
        + '</h1><div class="sub" '
        + 'style="margin:2px 0 6px">'
        + esc(m.email)
        + '</div><span class="pill on1">'
        + esc(m.role)
        + '</span> <span class="sub">Member since '
        + esc(m.joined)
        + '</span></div><button class="btn d" '
        + 'style="margin-left:auto" '
        + 'onclick="logout()">Logout</button></div>'
        + (
          isAdm()
            ? '<div class="panel" '
              + 'style="border-color:var(--p)"><div '
              + 'class="row sp" style="flex-wrap:wrap">'
              + '<div><h2 style="margin:0">'
              + 'Admin Dashboard</h2><span class="sub">'
              + 'Simamia games, bidhaa na oda zako.'
              + '</span></div>'
              + '<div class="row" style="flex-wrap:wrap">'
              + '<a class="btn" href="dashboard.html">'
              + 'Open Dashboard</a><a class="btn o" '
              + 'href="games-management.html">'
              + 'Manage Games</a><a class="btn o" '
              + 'href="orders-sales.html">Orders</a>'
              + '</div></div></div>'
            : ''
        )
        + '<div class="stats" '
        + 'style="margin-top:14px">'
        + '<div class="stat"><b>'
        + libItems().length
        + '</b><span>Games Library</span></div>'
        + '<div class="stat"><b>'
        + db.wish.length
        + '</b><span>Wishlist</span></div>'
        + '<div class="stat"><b>'
        + db.cart.length
        + '</b><span>Cart</span></div>'
        + '<div class="stat"><b>'
        + mo.length
        + '</b><span>Oda zangu</span></div></div>'
        + '<div class="panel">'
        + '<h2 style="margin-top:0">Account Details'
        + '</h2><form onsubmit="upd(event)"><label>'
        + 'Jina<input name="nm" required value="'
        + esc(m.name)
        + '"></label><label>Simu'
        + '<input name="ph" value="'
        + esc(m.phone)
        + '"></label><label>Email<input value="'
        + esc(m.email)
        + '" disabled></label><div class="full">'
        + '<button class="btn" type="submit">'
        + 'Save Changes</button></div></form></div>'
        + '<div class="panel">'
        + '<h2 style="margin-top:0">Oda Zangu</h2>'
        + (
          mo.length
            ? '<div class="tw"><table><tr><th>Order'
              + '</th><th>Bidhaa</th><th>Amount</th><th>'
              + 'Date</th><th>Status</th><th></th></tr>'
              + mo.map(function (o) {
                return '<tr><td>'
                  + esc(o.ref)
                  + '</td><td>'
                  + esc(o.items.join(', '))
                  + '</td><td>'
                  + tsh(o.total)
                  + '</td><td>'
                  + o.date
                  + '</td><td>'
                  + esc(o.status || '')
                  + '</td><td>'
                  + (
                    isAdm() && o.status === 'Pending'
                      ? '<button class="btn" onclick="conf(\''
                        + o.id
                        + '\')">Confirm</button> '
                        + '<button class="btn d" onclick="rej(\''
                        + o.id
                        + '\')">Reject</button>'
                      : ''
                  )
                  + '</td></tr>';
              }).join('')
              + '</table></div>'
            : '<div class="empty">Bado hujaagiza kitu.</div>'
        )
        + '</div>';
    });
  </script>

</body>
</html>
