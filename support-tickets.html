<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Admin · Support Tickets - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Admin · Support Tickets
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'support-tickets.html',
      pg: 'admin',
      p: 'tickets',
      admin: 1
    }, function (a, q, A, pg) {
      return '<h1>Support Tickets</h1><p class="sub">'
        + 'Maombi ya msaada kutoka kwa wateja ('
        + db.tix.length
        + ')</p><div class="panel">'
        + (
          db.tix.length
            ? '<div class="tw"><table><tr><th>Mteja'
              + '</th><th>Aina</th><th>Ujumbe</th><th>'
              + 'Tarehe</th><th>Hali</th><th></th></tr>'
              + db.tix.map(function (t, i) {
                return '<tr><td>'
                  + esc(t.name)
                  + '<br><small class="sub">'
                  + esc(t.contact || t.user)
                  + '</small></td><td>'
                  + esc(t.category)
                  + (
                    t.orderRef
                      ? '<br><small class="sub">'
                        + esc(t.orderRef)
                        + '</small>'
                      : ''
                  )
                  + '</td><td>'
                  + esc(t.message)
                  + '</td><td>'
                  + new Date(t.createdAt).toLocaleDateString()
                  + '</td><td><span class="pill '
                  + (t.status === 'open' ? 'off1' : 'on1')
                  + '">'
                  + esc(t.status)
                  + '</span></td><td class="row"><button '
                  + 'class="btn o" onclick="resTicket('
                  + i
                  + ')">'
                  + (
                    t.status === 'open' ? 'Resolve' : 'Reopen'
                  )
                  + '</button><button class="btn d" '
                  + 'onclick="delTicket('
                  + i
                  + ')">Futa</button></td></tr>';
              }).join('')
              + '</table></div>'
            : '<div class="empty">Hakuna tiketi bado.</div>'
        )
        + '</div>';
    });
  </script>

</body>
</html>
