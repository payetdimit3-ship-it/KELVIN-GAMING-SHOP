<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Movies - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Movies
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'movies.html',
      pg: 'movies',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var M = db.movies.filter(function (m) {
        return !q
          || String(m.title).toLowerCase().indexOf(q) > -1;
      }),
        cur = db.movies.find(function (m) {
          return m.id === mv;
        });
      return '<h1>Movies</h1><p class="sub">'
        + 'Tazama movies mtandaoni</p>'
        + (
          cur
            ? '<div class="panel" style="margin-top:0">'
              + player(cur)
              + '<h2>'
              + esc(cur.title)
              + '</h2><p class="sub">'
              + esc(cur.genre)
              + ' · '
              + esc(cur.year)
              + '</p><p>'
              + esc(cur.description)
              + '</p></div>'
            : ''
        )
        + (
          isAdm()
            ? '<div class="panel">'
              + '<h2 style="margin-top:0">Add Movie</h2>'
              + '<form onsubmit="addMovie(event)"><label>'
              + 'Title<input name="t" required></label>'
              + '<label>Genre<input name="g"></label>'
              + '<label>Year<input name="y" value="2026">'
              + '</label><label>Poster URL'
              + '<input name="p" type="url"></label>'
              + '<label class="full">'
              + 'Video URL (mp4/webm au link)'
              + '<input name="v" type="url" required>'
              + '</label><label class="full">Description'
              + '<textarea name="d" rows="2"></textarea>'
              + '</label><div class="full">'
              + '<button class="btn" type="submit">'
              + 'Save Movie</button></div></form></div>'
            : ''
        )
        + (
          M.length
            ? '<div class="grid" '
              + 'style="margin-top:14px">'
              + M.map(movCard).join('')
              + '</div>'
            : '<div class="empty" '
              + 'style="margin-top:14px">'
              + 'Hakuna movie bado.</div>'
        );
    });
  </script>

</body>
</html>
