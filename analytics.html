<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Admin · Analytics - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Admin · Analytics
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'analytics.html',
      pg: 'admin',
      p: 'analytics',
      admin: 1
    }, function (a, q, A, pg) {
      var an = db.an || { days: [], topProducts: [] },
        mx = Math.max.apply(
          null,
          (an.days || []).map(function (d) {
            return d.total;
          }).concat([1])
        );
      return '<h1>Analytics</h1><p class="sub">'
        + 'Mauzo ya siku 14 zilizopita</p>'
        + '<div class="panel"><div '
        + 'style="display:flex;align-items:flex-end;gap:6px;height:180px;overflow-x:auto">'
        + (an.days || []).map(function (d) {
          return '<div '
            + 'style="flex:1;min-width:26px;text-align:center">'
            + '<div title="'
            + tsh(d.total)
            + '" style="height:'
            + Math.round(d.total / mx * 140)
            + 'px;min-height:2px;background:linear-gradient(var(--p2),var(--p));border-radius:6px '
            + '6px 0 0"></div><small '
            + 'style="color:var(--m);font-size:10px">'
            + esc(d.label)
            + '</small></div>';
        }).join('')
        + '</div></div><div class="panel">'
        + '<h2 style="margin-top:0">Top Products'
        + '</h2>'
        + (
          (an.topProducts || []).length
            ? an.topProducts.map(function (t, i) {
              return '<div class="row sp" '
                + 'style="padding:6px 0;border-bottom:1px solid var(--line)">'
                + '<span>'
                + (i + 1)
                + '. '
                + esc(t.name)
                + '</span><b>'
                + Number(t.qty)
                + '</b></div>';
            }).join('')
            : '<div class="empty">Bado hakuna mauzo.</div>'
        )
        + '</div>';
    });
  </script>

</body>
</html>
