<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Account — GameHub</title><link rel="stylesheet" href="style.css"></head><body>

<div class="account-page" id="accountPage"><h1>👤 Dashboard Yangu</h1>
<div class="welcome-box" id="welcomeBox"><h2>Karibu!</h2><p id="userInfo">—</p></div>

<div class="admin-tabs"><button class="tab-btn active" data-tab="myorders">📦 Oda Zangu</button><button class="tab-btn" data-tab="quicklinks">🔗 Haraka</button><button class="tab-btn" id="adminTab" style="display:none;" data-tab="admin">⚙️ Admin</button></div>
<div class="tab-content" id="tab-myorders"><div class="admin-list" id="myOrdersList"><p style="color:#8f8faa;">Inapakia...</p></div></div>
<div class="tab-content" id="tab-quicklinks" style="display:none;"><div class="quick-grid"><a href="shop.html" class="quick-card">🛒 Nunua Game</a><a href="rental.html" class="quick-card">⏱️ Kodisha Muda</a><a href="mygames.html" class="quick-card">🎮 Cheza (My Games)</a><a href="requests.html" class="quick-card">🔍 Omba Game</a><a href="https://play.geforcenow.com" target="_blank" class="quick-card">🚀 GeForce NOW</a><a href="index.html" class="quick-card">🏠 Home</a></div></div>

</div>
<script>
const token=localStorage.getItem('gamehubToken');const user=JSON.parse(localStorage.getItem('gamehubUser')||'null');
if(!user||!token){document.getElementById('accountPage').innerHTML='<div class="cart-empty"><p>🔐 Ingia kwanza.</p><a href="login.html" class="btn-primary" style="display:inline-block;margin-top:10px;">Ingia</a></div>';}else{document.getElementById('welcomeBox').innerHTML=`<h2>Karibu, ${user.name}! 👋</h2><p id="userInfo">📧 ${user.email}${user.isAdmin?' • 👑 ADMIN':''}</p>`;if(user.isAdmin){document.getElementById('adminTab').style.display='inline-block';}}
async function loadMyOrders(){try{const r=await fetch('/api/myorders',{headers:{'Authorization':token}});const d=await r.json();const orders=d.orders||d||[];document.getElementById('myOrders').textContent=orders.length;const list=document.getElementById('myOrdersList');if(!orders.length){list.innerHTML='<p style="color:#8f8faa;">Hujafanya oda bado. <a href="shop.html" style="color:#00e5ff;">Nunua sasa!</a></p>';return;}list.innerHTML=orders.map(o=>`<div class="admin-row"><div><strong>${new Date(o.created_at||o.date).toLocaleString()}</strong><br><small style="color:#00e5ff;">Ref: ${o.tx_ref} • ${o.status === 'paid' ? '✅ Imelipwa' : '⏳ Inasubiri'}</small></div><div class="admin-amount">${Number(o.amount).toLocaleString()} TZS</div></div>`).join('');}catch(e){}}
