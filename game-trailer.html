<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Game Trailers - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Game Trailers
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'game-trailer.html',
      pg: 'trailers',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var T = A.filter(function (p) {
        return p.trailer
          && (!q || p.title.toLowerCase().indexOf(q) > -1);
      }),
        cur = T.find(function (p) { return p.id === a[2]; });
      return '<h1>Game Trailers</h1><p class="sub">'
        + 'Tazama trailer kabla ya kununua</p>'
        + (
          cur
            ? '<div class="panel" style="margin-top:0">'
              + player({ videoUrl: cur.trailer })
              + '<div class="row sp" '
              + 'style="margin-top:12px;flex-wrap:wrap">'
              + '<div><h2 style="margin:0">'
              + esc(cur.title)
              + '</h2><span class="tag">'
              + esc(cur.platform)
              + '</span><span class="price">'
              + ptx(cur)
              + '</span></div><a class="btn" '
              + 'href="product-details.html?p='
              + cur.id
              + '">Angalia game</a></div></div>'
            : ''
        )
        + (
          T.length
            ? '<div class="grid" '
              + 'style="margin-top:14px">'
              + T.map(function (p) {
                return '<a class="card" '
                  + 'href="game-trailer.html?p='
                  + p.id
                  + '">'
                  + img(p)
                  + '<div class="b"><b>'
                  + esc(p.title)
                  + '</b><span class="tag">▶ Trailer</span>'
                  + '</div></a>';
              }).join('')
              + '</div>'
            : '<div class="empty" '
              + 'style="margin-top:14px">Hakuna trailer '
              + 'bado. Admin anaweza kuweka Trailer URL '
              + 'kwenye game.</div>'
        );
    });
  </script>

</body>
</html>
