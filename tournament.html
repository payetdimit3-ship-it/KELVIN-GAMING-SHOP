<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Tournaments - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Tournaments
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'tournament.html',
      pg: 'tournaments',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var T = db.tour,
        op = T.filter(function (t) {
          return t.status === 'OPEN';
        }),
        m0 = me() || {};
      return '<h1>Tournaments</h1><p class="sub">'
        + 'Shindana na upate zawadi</p>'
        + (
          op.length
            ? '<div class="panel">'
              + '<h2 style="margin-top:0">Jisajili</h2>'
              + '<form onsubmit="regT(event)"><label>'
              + 'Tournament<select name="t">'
              + op.map(function (t) {
                return '<option value="'
                  + esc(t.id)
                  + '">'
                  + esc(t.name)
                  + '</option>';
              }).join('')
              + '</select></label><label>Jina'
              + '<input name="n" required value="'
              + esc(m0.name || '')
              + '"></label><label>Simu'
              + '<input name="p" required value="'
              + esc(m0.phone || '')
              + '" placeholder="+255..."></label>'
              + '<div class="full">'
              + '<button class="btn" type="submit">'
              + 'Register</button></div></form></div>'
            : ''
        )
        + (
          T.length
            ? '<div class="grid" '
              + 'style="margin-top:14px">'
              + T.map(function (t) {
                return '<div class="card"><div class="b"><b>'
                  + esc(t.name)
                  + '</b><span class="tag">'
                  + esc(t.game)
                  + '</span>'
                  + '<span class="sub" style="margin:0">'
                  + esc(t.date)
                  + '</span>'
                  + '<span class="sub" style="margin:0">'
                  + esc(t.description)
                  + '</span><div><span class="pill '
                  + (t.status === 'OPEN' ? 'on1' : 'off1')
                  + '">'
                  + esc(t.status)
                  + '</span> <span class="sub">'
                  + (t.registrations || []).length
                  + ' wamesajiliwa</span></div></div></div>';
              }).join('')
              + '</div>'
            : '<div class="empty" '
              + 'style="margin-top:14px">'
              + 'Hakuna tournament bado.</div>'
        );
    });
  </script>

</body>
</html>
