<!doctype html>
<html lang="sw">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account — MchezoHub</title><link rel="stylesheet" href="mchezo.css"></head>
<body>
  <main class="mh-auth"><section class="mh-auth-card">
    <a class="mh-brand" href="index.html"><b class="mh-mark">MH</b><span>Mchezo<span>Hub</span></span></a>
    <div class="mh-kicker" style="margin-top:28px">PLAYER REGISTRATION</div><h1>Create account</h1><p class="mh-muted">Jiunge na gamers wa Tanzania na fungua digital library yako.</p>
    <form class="mh-form" data-signup>
      <label>Full name<input required type="text" placeholder="Kelvin Gamer"></label>
      <label>Email<input required type="email" placeholder="you@example.com"></label>
      <label>Password<input required minlength="6" type="password" placeholder="Angalau characters 6"></label>
      <div class="mh-alert" role="status"></div><button class="mh-btn" type="submit">Create account</button>
    </form>
    <p class="mh-form-note">Tayari una account? <a class="mh-cyan" href="login.html">Ingia hapa</a><br><a href="../index.html">← Rudi Kelvin Gaming Shop</a></p>
  </section></main>
  <script src="mchezo.js"></script>
</body>
</html>
