<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Home - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Home
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'index.html',
      pg: 'home',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      return '<div class="hero"><h1>'
        + 'PLAY · LEARN · EARN</h1><p class="sub">'
        + 'Nunua games zako uzipendazo kwa haraka '
        + 'na usalama.</p>'
        + '<a class="btn" href="store.html">'
        + 'Browse Games</a></div><h2>Trending Games'
        + '</h2>'
        + (
          A.length
            ? '<div class="grid">'
              + A.slice(0, 10).map(card).join('')
              + '</div>'
            : emptyAdmin(
              'Bado hakuna games. Bidhaa zote '
                + 'zinaongezwa kupitia Admin Dashboard.'
            )
        )
        + (
          A.some(function (p) { return p.free; })
            ? '<h2>Free Games</h2><div class="grid">'
              + A.filter(function (p) {
                return p.free;
              }).slice(0, 5).map(card).join('')
              + '</div>'
            : ''
        );
    });
  </script>

</body>
</html>
