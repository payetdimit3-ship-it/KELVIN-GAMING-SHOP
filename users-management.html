<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Admin · Users - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Admin · Users
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'users-management.html',
      pg: 'admin',
      p: 'users',
      admin: 1
    }, function (a, q, A, pg) {
      return '<h1>Users</h1><p class="sub">'
        + 'Wateja wote ('
        + db.users.length
        + ')</p><div class="panel"><div class="tw">'
        + '<table><tr><th>Jina</th><th>Email</th>'
        + '<th>Simu</th><th>Role</th><th>Alijiunga'
        + '</th><th></th></tr>'
        + db.users.map(function (u, i) {
          var role = u.isAdmin
            ? 'Super Admin'
            : (u.isStaff ? 'Staff' : 'Customer');
          return '<tr><td>'
            + esc(u.name)
            + '</td><td>'
            + esc(u.email)
            + '</td><td>'
            + esc(u.phone || '')
            + '</td><td><span class="pill '
            + (u.isAdmin ? 'on1' : 'off1')
            + '">'
            + role
            + '</span></td><td>'
            + (
              u.created
                ? new Date(u.created).toLocaleDateString()
                : ''
            )
            + '</td><td>'
            + (
              u.isAdmin
                ? ''
                : '<button class="btn o" onclick="staff('
                  + i
                  + ','
                  + (!u.isStaff)
                  + ')">'
                  + (u.isStaff ? 'Ondoa Staff' : 'Make Staff')
                  + '</button>'
            )
            + '</td></tr>';
        }).join('')
        + '</table></div></div>';
    });
  </script>

</body>
</html>
