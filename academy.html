<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Academy - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Academy
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'academy.html',
      pg: 'academy',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var C = db.courses,
        sel = C.find(function (c) { return c.id === cs; });
      return '<h1>Academy</h1><p class="sub">'
        + 'Jifunze kupitia video za kozi</p>'
        + (
          isAdm()
            ? '<div class="panel">'
              + '<h2 style="margin-top:0">Add Course</h2>'
              + '<form onsubmit="addCourse(event)">'
              + '<label>Jina la kozi'
              + '<input name="n" required></label><label>'
              + 'Level<select name="l"><option>Beginner'
              + '</option><option>Intermediate</option>'
              + '<option>Advanced</option></select>'
              + '</label><label class="full">'
              + 'Thumbnail URL<input name="t" type="url">'
              + '</label><label class="full">Maelezo'
              + '<textarea name="d" rows="2"></textarea>'
              + '</label><div class="full">'
              + '<button class="btn" type="submit">'
              + 'Save Course</button></div></form></div>'
            : ''
        )
        + (
          sel
            ? '<div class="panel"><div class="row sp">'
              + '<h2 style="margin:0">'
              + esc(sel.name)
              + '</h2><button class="btn o" '
              + 'onclick="cs=\'\';route()">← Kozi zote'
              + '</button></div><p class="sub">'
              + esc(sel.description)
              + '</p>'
              + (
                (sel.videos || []).length
                  ? sel.videos.map(function (v) {
                    return '<div style="margin:14px 0"><b>'
                      + esc(v.title)
                      + '</b><div class="sub" '
                      + 'style="margin:2px 0 8px">'
                      + esc(v.description)
                      + '</div>'
                      + player({ videoUrl: v.url })
                      + (
                        isAdm()
                          ? '<button class="btn d" '
                            + 'style="margin-top:8px" '
                            + 'onclick="delVid(\''
                            + sel.id
                            + '\',\''
                            + v.id
                            + '\')">Futa video</button>'
                          : ''
                      )
                      + '</div>';
                  }).join('')
                  : '<div class="empty">Hakuna video bado.</div>'
              )
              + (
                isAdm()
                  ? '<form onsubmit="upVid(event,\''
                    + sel.id
                    + '\')" style="margin-top:14px"><label>'
                    + 'Title ya video<input name="t" required>'
                    + '</label><label>Video (mp4/webm/mov)'
                    + '<input name="f" type="file" '
                    + 'accept="video/*" required></label>'
                    + '<div class="full">'
                    + '<button class="btn" type="submit">'
                    + 'Upload Video</button></div></form>'
                  : ''
              )
              + '</div>'
            : (
              C.length
                ? '<div class="grid" '
                  + 'style="margin-top:14px">'
                  + C.map(function (c) {
                    return '<div class="card" '
                      + 'style="cursor:pointer" onclick="cs=\''
                      + c.id
                      + '\';route();scrollTo(0,0)">'
                      + (
                        c.thumbnail
                          ? '<img src="'
                            + esc(c.thumbnail)
                            + '" alt="">'
                          : '<div class="ph"></div>'
                      )
                      + '<div class="b"><b>'
                      + esc(c.name)
                      + '</b><span class="tag">'
                      + esc(c.level)
                      + '</span>'
                      + '<span class="sub" style="margin:0">'
                      + (c.videos || []).length
                      + ' video</span></div></div>';
                  }).join('')
                  + '</div>'
                : '<div class="empty" '
                  + 'style="margin-top:14px">'
                  + 'Hakuna kozi bado.</div>'
            )
        )
        + tutorPanel(sel);
    });
  </script>

</body>
</html>
