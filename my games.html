<script src="config.js"></script>
<script>
const SUPABASE_URL = window.ENV?.SUPABASE_URL || '';
const SUPABASE_ANON_KEY = window.ENV?.SUPABASE_ANON_KEY || '';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allGames = [];
let activeFilter = 'all';

document.querySelectorAll('.filter-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderGrid();
  });
});

async function loadLibrary() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }

  const { data: library } = await db.from('my_games').select('*, games(*)').eq('user_id', session.user.id).order('purchased_at', { ascending: false });
  allGames = (library || []).filter(l => l.games);

  document.getElementById('side-lib').textContent = allGames.length;
  document.getElementById('count-all').textContent = allGames.length;
  document.getElementById('count-installed').textContent = allGames.filter(g => g.install_status === 'installed').length;
  document.getElementById('count-downloading').textContent = allGames.filter(g => g.install_status === 'downloading').length;
  document.getElementById('count-not').textContent = allGames.filter(g => g.install_status === 'not_installed').length;

  renderGrid();
}

function renderGrid() {
  const container = document.getElementById('library-grid');
  let filtered = allGames;
  if (activeFilter !== 'all') {
    filtered = filtered.filter(g => (g.install_status || 'installed') === activeFilter);
  }

  document.getElementById('total-games').textContent = filtered.length;
  document.getElementById('showing-start').textContent = filtered.length > 0 ? 1 : 0;
  document.getElementById('showing-end').textContent = Math.min(12, filtered.length);

  if (filtered.length === 0) {
    container.innerHTML = `<div class="col-span-full text-center py-12">
      <div class="text-5xl mb-3">📚</div>
      <div class="text-white font-bold mb-2">Hakuna games bado</div>
      <div class="text-sm text-gray-500">Nunua games ili kuyaona hapa</div>
    </div>`;
    return;
  }

  container.innerHTML = filtered.map(item => {
    const g = item.games;
    const status = item.install_status || 'installed';
    const progress = item.download_progress || 0;
    
    let statusBadge = '';
    let actionBtn = '';
    
    if (status === 'installed') {
      statusBadge = `<span class="text-[9px] text-green-400 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-400"></span> Installed</span>`;
      actionBtn = `<button class="w-full gradient-primary text-white text-xs font-bold py-2 rounded-lg">Play</button>`;
    } else if (status === 'downloading') {
      statusBadge = `<span class="text-[9px] text-blue-400 flex items-center gap-1">↓ Downloading (${progress}%)</span>`;
      actionBtn = `<button class="w-full bg-blue-600 text-white text-xs font-bold py-2 rounded-lg">Downloading ${progress}%</button>`;
    } else {
      statusBadge = `<span class="text-[9px] text-gray-400 flex items-center gap-1">○ Not Installed</span>`;
      actionBtn = `<button class="w-full bg-dark-4 hover:bg-dark-3 text-white text-xs font-bold py-2 rounded-lg flex items-center justify-center gap-1">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Download
      </button>`;
    }

    return `
      <div class="gradient-card rounded-xl border border-dark-4 overflow-hidden hover:border-primary transition group">
        <div class="aspect-square bg-dark-3 relative overflow-hidden">
          ${g.image_url ? `<img src="${g.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition">` : ''}
          ${g.is_best_seller ? `<span class="absolute top-2 left-2 bg-yellow-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">👑</span>` : ''}
          ${status === 'installed' ? `<span class="absolute top-2 right-2 w-5 h-5 rounded-full bg-green-500 flex items-center justify-center text-white text-[10px]">✓</span>` : ''}
        </div>
        <div class="p-3">
          <div class="text-xs text-white font-semibold truncate mb-1">${g.title}</div>
          <div class="flex gap-1 mb-2">
            ${(g.platforms || []).slice(0, 3).map(p => `<span class="text-[8px] bg-dark-3 px-1.5 py-0.5 rounded text-gray-400">${p}</span>`).join('')}
          </div>
          <div class="mb-2">${statusBadge}</div>
          ${actionBtn}
        </div>
      </div>
    `;
  }).join('');
}

document.addEventListener('DOMContentLoaded', loadLibrary);
</script>


<script id="lifeisgametz-navigation-repair">
(function () {
  function initNavigationRepair() {
    var toggles = document.querySelectorAll('[data-mobile-menu-toggle="true"]');
    var nav = document.querySelector('aside') || document.querySelector('[role="navigation"]') ||
              document.querySelector('nav');
    toggles.forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!nav) {
          window.location.href = 'index.html';
          return;
        }
        nav.classList.toggle('lifeisgametz-mobile-nav-open');
        nav.style.display = nav.classList.contains('lifeisgametz-mobile-nav-open') ? 'flex' : '';
        nav.style.position = nav.classList.contains('lifeisgametz-mobile-nav-open') ? 'fixed' : '';
        nav.style.zIndex = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '9999' : '';
        nav.style.top = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0' : '';
        nav.style.left = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0' : '';
        nav.style.bottom = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0' : '';
        nav.style.width = nav.classList.contains('lifeisgametz-mobile-nav-open') ? 'min(85vw, 320px)' : '';
        nav.style.overflowY = nav.classList.contains('lifeisgametZ-mobile-nav-open') ? 'auto' : '';
        nav.style.background = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '#0f0f1e' : '';
        nav.style.paddingTop = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '1rem' : '';
        nav.style.boxShadow = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0 0 0 100vmax rgba(0,0,0,.65)' : '';
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && nav) {
        nav.classList.remove('lifeisgametz-mobile-nav-open');
        nav.style.display = '';
        nav.style.position = nav.style.zIndex = nav.style.top = nav.style.left = nav.style.bottom = '';
        nav.style.width = nav.style.overflowY = nav.style.background = nav.style.paddingTop = nav.style.boxShadow = '';
      }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNavigationRepair);
  else initNavigationRepair();
})();
</script>
