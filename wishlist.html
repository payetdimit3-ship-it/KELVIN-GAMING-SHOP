<script src="config.js"></script>
<script>
const SUPABASE_URL = window.ENV?.SUPABASE_URL || '';
const SUPABASE_ANON_KEY = window.ENV?.SUPABASE_ANON_KEY || '';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadWishlist() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }

  const { data: wishlist } = await db.from('wishlists').select('*, games(*)').eq('user_id', session.user.id).order('added_at', { ascending: false });

  const container = document.getElementById('wishlist-items');
  const count = wishlist?.length || 0;
  document.getElementById('wish-count').textContent = `(${count})`;
  document.getElementById('side-wish-count').textContent = count;

  if (count === 0) {
    container.innerHTML = `
      <div class="gradient-card rounded-2xl border border-dark-4 p-12 text-center">
        <div class="text-5xl mb-3">💔</div>
        <div class="text-white font-bold mb-2">Wishlist yako ni tupu</div>
        <div class="text-sm text-gray-400 mb-4">Ongeza games kwenye wishlist</div>
        <a href="/store.html" class="inline-block gradient-primary text-white text-sm font-bold px-5 py-2.5 rounded-lg">Nenda Dukani</a>
      </div>
    `;
    return;
  }

  container.innerHTML = wishlist.map(w => {
    const g = w.games;
    if (!g) return '';
    const price = parseFloat(g.price || 0);
    const discountPrice = parseFloat(g.discount_price || price * 0.8);
    const discount = Math.round(((price - discountPrice) / price) * 100);
    return `
      <div class="gradient-card rounded-2xl border border-dark-4 p-4 flex flex-col md:flex-row gap-4">
        <div class="relative w-full md:w-48 h-48 md:h-32 rounded-xl overflow-hidden bg-dark-3 shrink-0">
          ${g.image_url ? `<img src="${g.image_url}" class="w-full h-full object-cover">` : ''}
          <button class="absolute top-2 left-2 w-7 h-7 rounded-full bg-dark-2/80 backdrop-blur flex items-center justify-center text-pink-400">
            <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
          </button>
          <button onclick="removeFromWishlist('${w.id}')" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-dark-2/80 backdrop-blur flex items-center justify-center text-gray-400 hover:text-red-400">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="flex-1 min-w-0">
          <h3 class="text-white font-bold mb-2">${g.title}</h3>
          <div class="flex gap-1 mb-2">
            ${(g.platforms || []).map(p => `<span class="text-[9px] bg-dark-3 px-2 py-0.5 rounded text-gray-400">${p}</span>`).join('')}
          </div>
          <div class="text-xs text-gray-500 mb-3">${(g.genres || ['Action', 'Adventure']).join(' | ')} | ${g.category || 'Game'}</div>
          <div class="flex items-baseline gap-2 mb-3">
            <span class="text-xl font-bold text-primary">TSh ${discountPrice.toLocaleString()}</span>
            <span class="text-sm text-gray-500 line-through">TZS ${price.toLocaleString()}</span>
            <span class="text-[10px] bg-green-500 text-white px-2 py-0.5 rounded font-bold">-${discount}%</span>
          </div>
          <div class="flex gap-2">
            <button onclick="addToCart('${g.id}', '${w.id}')" class="gradient-primary text-white text-sm font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
              Add to Cart
            </button>
            <a href="/game.html?id=${g.id}" class="bg-dark-3 hover:bg-dark-4 border border-dark-4 text-white text-sm font-semibold px-5 py-2.5 rounded-lg flex items-center gap-2">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
              View Details
            </a>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

async function removeFromWishlist(id) {
  if (!confirm('Ondoa kwenye wishlist?')) return;
  await db.from('wishlists').delete().eq('id', id);
  loadWishlist();
}

async function addToCart(gameId, wishlistId) {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = '/login.html'; return; }
  await db.from('cart_items').insert({ user_id: session.user.id, game_id: gameId, quantity: 1 });
  await db.from('wishlists').delete().eq('id', wishlistId);
  alert('✅ Game imeongezwa kwenye kikapu!');
  loadWishlist();
}

document.addEventListener('DOMContentLoaded', loadWishlist);
</script>


<script id="lifeisgametz-navigation-repair">
(function () {
  function initNavigationRepair() {
    var toggles = document.querySelectorAll('[data-mobile-menu-toggle="true"]');
    var nav = document.querySelector('aside') || document.querySelector('[role="navigation"]') ||
              document.querySelector('nav');
    toggles.forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (!nav) {
          window.location.href = 'index.html';
          return;
        }
        nav.classList.toggle('lifeisgametz-mobile-nav-open');
        nav.style.display = nav.classList.contains('lifeisgametz-mobile-nav-open') ? 'flex' : '';
        nav.style.position = nav.classList.contains('lifeisgametz-mobile-nav-open') ? 'fixed' : '';
        nav.style.zIndex = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '9999' : '';
        nav.style.top = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0' : '';
        nav.style.left = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0' : '';
        nav.style.bottom = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0' : '';
        nav.style.width = nav.classList.contains('lifeisgametz-mobile-nav-open') ? 'min(85vw, 320px)' : '';
        nav.style.overflowY = nav.classList.contains('lifeisgametZ-mobile-nav-open') ? 'auto' : '';
        nav.style.background = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '#0f0f1e' : '';
        nav.style.paddingTop = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '1rem' : '';
        nav.style.boxShadow = nav.classList.contains('lifeisgametz-mobile-nav-open') ? '0 0 0 100vmax rgba(0,0,0,.65)' : '';
      });
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && nav) {
        nav.classList.remove('lifeisgametz-mobile-nav-open');
        nav.style.display = '';
        nav.style.position = nav.style.zIndex = nav.style.top = nav.style.left = nav.style.bottom = '';
        nav.style.width = nav.style.overflowY = nav.style.background = nav.style.paddingTop = nav.style.boxShadow = '';
      }
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initNavigationRepair);
  else initNavigationRepair();
})();
</script>
