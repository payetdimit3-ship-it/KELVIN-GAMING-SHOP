<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Wishlist - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Wishlist
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'wishlist.html',
      pg: 'wishlist',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var w = db.wish.map(P).filter(Boolean);
      return '<h1>My Wishlist ('
        + w.length
        + ')</h1><p class="sub">Games ulizozipenda'
        + '</p>'
        + (
          w.length
            ? '<div class="grid">'
              + w.map(card).join('')
              + '</div>'
            : '<div class="empty">Wishlist ni tupu.</div>'
        );
    });
  </script>

</body>
</html>
