<!doctype html>
<html lang="sw">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Secure Checkout — MchezoHub</title><link rel="stylesheet" href="mchezo.css"></head>
<body>
  <nav class="mh-nav" data-mh-nav></nav>
  <main class="mh-wrap"><div class="mh-kicker">01 // PAYMENT GATEWAY</div><h1 style="font-size:clamp(2.7rem,7vw,5.7rem);margin:12px 0 8px;text-transform:uppercase;letter-spacing:-.07em">Complete your<br><span class="mh-pink">loadout.</span></h1><p class="mh-muted">Kagua bidhaa zako, chagua mtandao, weka namba yako, kisha endelea na AzamPay.</p>
    <div class="mh-checkout" style="margin-top:30px"><section class="mh-panel" style="padding:22px"><h2>Your cart</h2><div data-cart-lines></div></section>
      <section class="mh-panel" style="padding:22px;border-color:rgba(0,217,255,.4)"><h2>Order summary</h2><div class="mh-total"><span class="mh-muted">Total</span><strong data-total>0 TSh</strong></div><form class="mh-form" data-checkout><label>Mobile network<select><option>Airtel</option><option>Tigo</option><option>Halopesa</option><option>Azampesa</option><option>Mpesa</option></select></label><label>Tanzania phone<input name="phone" required inputmode="tel" placeholder="0712345678"></label><p class="mh-form-note">🛡️ PIN yako haihifadhiwi na MchezoHub.</p><div class="mh-alert" data-checkout-notice></div><button class="mh-btn secondary" type="submit">✓ Continue to AzamPay</button></form></section>
    </div>
  </main>
  <script src="mchezo.js"></script>
</body>
</html>
