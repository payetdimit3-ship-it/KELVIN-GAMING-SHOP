<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Checkout - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Checkout
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'checkout.html',
      pg: 'checkout',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      if (!me())
        return '<div class="empty">'
          + 'Ingia kwanza ili ukamilishe oda.<br><br>'
          + '<a class="btn" href="login.html">'
          + 'Login / Register</a></div>';
      var ci = db.cart.map(P).filter(Boolean),
        ct = ci.reduce(function (s, p) {
          return s + p.price;
        }, 0);
      if (!ci.length)
        return '<div class="empty">Cart ni tupu.<br><br>'
          + '<a class="btn" href="store.html">'
          + 'Nunua Games</a></div>';
      return '<h1>Checkout</h1><p class="sub">'
        + 'Kamilisha oda yako</p><form '
        + 'onsubmit="event.preventDefault();checkout(this)">'
        + '<div class="panel full">'
        + '<h2 style="margin-top:0">'
        + 'Shipping & Billing</h2><div '
        + 'style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">'
        + '<label>Full Name<input required value="'
        + esc(me().name)
        + '"></label><label>Email'
        + '<input type="email" required></label>'
        + '<label>Phone (ya malipo)<input '
        + 'name="ph" required '
        + 'placeholder="+255..."></label><label>'
        + 'City<input required></label></div></div>'
        + '<div class="panel full">'
        + '<h2 style="margin-top:0">Payment Method'
        + '</h2>'
        + [
          'ClickPesa (USSD: M-Pesa, Tigo, Airtel, '
            + 'Halopesa)',
          'Manual (nimetuma pesa mwenyewe)'
        ].map(function (m, i) {
          return '<label '
            + 'style="flex-direction:row;align-items:center;gap:8px;padding:6px 0;color:var(--t)">'
            + '<input type="radio" name="pay" value="'
            + m
            + '" '
            + (i ? '' : 'checked')
            + '>'
            + m
            + '</label>';
        }).join('')
        + '<label style="margin-top:8px">'
        + 'Namba ya muamala (kwa Manual tu)<input '
        + 'name="tx" placeholder="mf. QK12ABC345">'
        + '</label></div><div class="panel full">'
        + '<div class="row" style="flex-wrap:wrap">'
        + '<input id="cpi" '
        + 'placeholder="Kodi ya punguzo" '
        + 'style="flex:1;min-width:140px" value="'
        + (cpn ? esc(cpn.code) : '')
        + '"><button class="btn o" type="button" '
        + 'onclick="applyCp()">Apply</button>'
        + '<button class="btn d" type="button" '
        + 'onclick="clrCp()">Ondoa</button></div>'
        + '</div><div class="panel full">'
        + '<div class="row sp"><b id="ctot">Jumla: '
        + tsh(
          cpn
            ? Math.max(
              1,
              Math.round(ct * (100 - cpn.pct) / 100)
            )
            : ct
        )
        + (cpn ? ' (−' + cpn.pct + '%)' : '')
        + '</b><button class="btn" type="submit">'
        + 'Pay Now</button></div></div></form>';
    });
  </script>

</body>
</html>
