<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1,
                 viewport-fit=cover">
  <title>Cart - LIFEISGAMETZ</title>
  <link rel="stylesheet" href="assets/lgz.css">
</head>
<body>

  <!-- Muundo wa ukurasa: sidebar + header + maudhui -->
  <div class="app">

    <aside id="side"></aside>

    <div style="min-width:0">
      <header>
        <button class="menu" aria-label="Menu"
                onclick="side.classList.toggle('open')">
          &#9776;
        </button>
        <input id="q" placeholder="Tafuta games..."
               aria-label="Tafuta">
        <div class="user" id="usr"></div>
      </header>

      <main id="main"></main>
    </div>

  </div>

  <div id="toast" role="status"></div>

  <!-- Msimbo wa pamoja (API, cart, login, sidebar) -->
  <script src="assets/lgz-core.js"></script>

  <!-- ========================================================
       MSIMBO WA UKURASA HUU: Cart
       ======================================================== -->
  <script>
    LGZ.page({
      file: 'cart.html',
      pg: 'cart',
      p: '',
      admin: 0
    }, function (a, q, A, pg) {
      var it = db.cart.map(P).filter(Boolean),
        tot = it.reduce(function (s, p) {
          return s + p.price;
        }, 0);
      if (!it.length)
        return '<h1>Your Cart</h1><div class="empty">'
          + 'Cart ni tupu.<br><br>'
          + '<a class="btn" href="store.html">'
          + 'Endelea Kununua</a></div>';
      return '<h1>Your Cart ('
        + it.length
        + ')</h1><div class="panel">'
        + it.map(function (p) {
          return '<div class="row sp" '
            + 'style="padding:10px 0;border-bottom:1px solid var(--line)">'
            + '<div class="row">'
            + '<div style="width:56px">'
            + img(p)
            + '</div><div><b>'
            + esc(p.title)
            + '</b><br><span class="tag">'
            + esc(p.platform)
            + '</span></div></div><div class="row">'
            + '<span class="price">'
            + tsh(p.price)
            + '</span>'
            + '<button class="btn d" onclick="rm(\''
            + p.id
            + '\')" aria-label="Ondoa">✕</button></div>'
            + '</div>';
        }).join('')
        + '<div class="row sp" '
        + 'style="margin-top:14px"><b>Jumla Kuu: '
        + tsh(tot)
        + '</b><button class="btn" '
        + 'onclick="location.href=\'checkout.html\'">'
        + 'Endelea Kulipa</button></div></div>';
    });
  </script>

</body>
</html>
